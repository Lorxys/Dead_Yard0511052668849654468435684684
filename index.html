<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101418">
<title>Dead Yard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="touch"></div>
<div class="stick" id="sL"><i></i></div>
<div class="stick" id="sR"><i></i></div>
<div id="hud"><span id="hp"></span><span id="wave"></span><span id="score"></span></div>
<div id="banner"></div>
<div id="menu" class="show">
  <p class="sub">Front Ouest · 1917</p>
  <h1>Dead Yard</h1>
  <button id="play">Jouer<i class="drip d1"></i><i class="drip d2"></i><i class="drip d3"></i><i class="drip d4"></i></button>
  <p class="tag">Ils sont tombés. Ils se relèvent.</p>
</div>
<div id="over">
  <h1>Vous êtes mort</h1>
  <p id="final"></p>
  <button id="restart">Rejouer</button>
</div>
<script src="js/config.js"></script>
<script src="js/input.js"></script>
<script src="js/sprites.js"></script>
<script src="js/map.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
<script>window.addEventListener('load', () => Game.init());</script>
</body>
</html>

<link rel="icon" type="image/png" href="icons/icon-192.png?v=1.00.51">

<body>
<canvas id="game"></canvas>
<div id="touch"></div>
<div class="stick" id="sL"><i></i></div>
<div class="stick" id="sR"><i></i></div>
<div id="sG"><i></i><b id="nadeCount"></b></div>
<div id="hud"><span class="left"><span id="hpbar"><b class="ghost"></b><b class="fill"></b><i></i><span id="hptext"></span></span><span id="nades"></span></span><span id="wave"></span><span id="score"></span></div>
<div id="perks"></div>
<div id="banner"></div>
<div id="buy">
  <span id="buyInfo"></span>
  <b id="buyName"></b>
  <button id="buyBtn"><span id="buyLabel">Acheter</span><small>E</small></button>
  <span id="buyPrice"></span>
</div>
<div id="menu" class="show">
  <p class="sub">Allemagne · 1945</p>
  <h1>Dead Yard<i class="drip" style="--l:6%;--w:5px;--h:34px;--s:5s;--d:.4s"></i><i class="drip" style="--l:21%;--w:3px;--h:20px;--s:4s;--d:2s"></i><i class="drip" style="--l:37%;--w:6px;--h:48px;--s:6s;--d:0s"></i><i class="drip" style="--l:62%;--w:4px;--h:26px;--s:4.5s;--d:1.2s"></i><i class="drip" style="--l:79%;--w:6px;--h:40px;--s:5.5s;--d:3s"></i><i class="drip" style="--l:92%;--w:3px;--h:18px;--s:3.5s;--d:.8s"></i></h1>
  <button id="play">Jouer<i class="drip" style="--l:8%;--w:6px;--h:38px;--s:4s;--d:0s"></i><i class="drip" style="--l:24%;--w:4px;--h:22px;--s:3.5s;--d:1.4s"></i><i class="drip" style="--l:41%;--w:7px;--h:52px;--s:5s;--d:.7s"></i><i class="drip" style="--l:58%;--w:3px;--h:18px;--s:3s;--d:2.1s"></i><i class="drip" style="--l:72%;--w:5px;--h:34px;--s:4.5s;--d:.3s"></i><i class="drip" style="--l:89%;--w:6px;--h:44px;--s:5.5s;--d:1.8s"></i></button>
  <p class="tag">Le Reich a réveillé ses morts.<br>Tiens la position, soldat.</p>
  <p class="version">v1.00.51</p>
</div>
<div id="mode" class="screen">
  <h2 class="title">Choisis ta partie</h2>
  <button id="toWorld">Carte du monde<i class="drip" style="--l:12%;--w:5px;--h:30px;--s:4s;--d:.3s"></i><i class="drip" style="--l:46%;--w:6px;--h:42px;--s:5s;--d:1.2s"></i><i class="drip" style="--l:84%;--w:4px;--h:24px;--s:4.5s;--d:.6s"></i></button>
  <button id="toCustom">Cartes personnalisées<i class="drip" style="--l:20%;--w:4px;--h:26px;--s:4.5s;--d:1.6s"></i><i class="drip" style="--l:63%;--w:6px;--h:38px;--s:5.5s;--d:.1s"></i><i class="drip" style="--l:90%;--w:3px;--h:18px;--s:3.5s;--d:2.2s"></i></button>
  <button id="modeBack" class="small">◀ Menu</button>
</div>
<div id="custom" class="screen">
  <h2 class="title">Cartes personnalisées</h2>
  <button id="customBack" class="small">◀ Retour</button>
</div>
<div id="world">
  <button id="wBack" class="small">◀ Retour</button>
  <h2 class="title">Choisis ton front</h2>
  <p class="hint">Touche un pays</p>
  <div id="pins"></div>
  <div id="front">
    <p id="fSub"></p>
    <h2 id="fName">Pays<i class="drip" style="--l:15%;--w:3px;--h:16px;--s:4s;--d:.3s"></i><i class="drip" style="--l:55%;--w:4px;--h:24px;--s:5s;--d:1.1s"></i><i class="drip" style="--l:85%;--w:3px;--h:14px;--s:3.5s;--d:2s"></i></h2>
    <div id="fMaps"></div>
    <button id="fBack" class="small">◀ Retour</button>
  </div>
</div>
<button id="pauseBtn" aria-label="Réglages"></button>
<div id="pause">
  <h1>Pause<i class="drip" style="--l:18%;--w:4px;--h:28px;--s:4s;--d:0s"></i><i class="drip" style="--l:70%;--w:6px;--h:40px;--s:5s;--d:.9s"></i></h1>
  <div class="actions">
    <button id="resume">Reprendre<i class="drip" style="--l:20%;--w:5px;--h:30px;--s:4s;--d:.2s"></i><i class="drip" style="--l:70%;--w:6px;--h:40px;--s:5s;--d:1.3s"></i></button>
    <button id="quit">Quitter<i class="drip" style="--l:30%;--w:4px;--h:26px;--s:4.5s;--d:.8s"></i><i class="drip" style="--l:75%;--w:5px;--h:34px;--s:5s;--d:2s"></i></button>
  </div>
  <p class="warn">Quitter la partie ?<br>Toute ta progression sera perdue.</p>
  <div class="actions confirm">
    <button id="quitYes">Confirmer<i class="drip" style="--l:25%;--w:5px;--h:30px;--s:4s;--d:.4s"></i><i class="drip" style="--l:72%;--w:4px;--h:24px;--s:4.5s;--d:1.5s"></i></button>
    <button id="quitNo">Retour<i class="drip" style="--l:35%;--w:4px;--h:22px;--s:4s;--d:1s"></i><i class="drip" style="--l:80%;--w:5px;--h:32px;--s:5s;--d:.2s"></i></button>
  </div>
</div>
<div id="over">
  <h1>Vous êtes mort<i class="drip" style="--l:12%;--w:4px;--h:30px;--s:4s;--d:0s"></i><i class="drip" style="--l:48%;--w:6px;--h:44px;--s:5s;--d:1s"></i><i class="drip" style="--l:83%;--w:4px;--h:24px;--s:3.5s;--d:.5s"></i></h1>
  <p id="final"></p>
  <div class="actions">
    <button id="restart">Rejouer<i class="drip" style="--l:20%;--w:5px;--h:30px;--s:4s;--d:.2s"></i><i class="drip" style="--l:70%;--w:6px;--h:40px;--s:5s;--d:1.3s"></i></button>
    <button id="toMenu">Menu<i class="drip" style="--l:30%;--w:4px;--h:26px;--s:4.5s;--d:.8s"></i><i class="drip" style="--l:75%;--w:5px;--h:34px;--s:5s;--d:2s"></i></button>
  </div>
</div>
<div id="rotate">
  <div class="phone"><i></i></div>
  <p>Tourne ton appareil<br>à l'horizontale</p>
</div>
<script>
// mise à jour automatique, à part des scripts du jeu pour marcher même si l'un d'eux plante :
// le téléphone peut garder une ancienne index.html en cache ; on demande la version en ligne sans cache et, si elle
// diffère de celle du menu, on recharge à une adresse neuve (?v=...). Au lancement et au retour sur l'appli, jamais en pleine partie.
function checkUpdate() {
  if (!location.protocol.startsWith('http')) return;
  const cur = document.querySelector('#menu .version').textContent.trim();
  fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' })
    .then(r => r.text())
    .then(html => {
      const m = html.match(/class="version">v([\d.]+)</);
      if (m && 'v' + m[1] !== cur && !location.search.includes('v=' + m[1])) location.replace(location.pathname + '?v=' + m[1]);
    })
    .catch(() => {});
}
checkUpdate();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (typeof Game === 'undefined' || Game.state === 'menu' || Game.state === 'world')) checkUpdate();
});
</script>
<script src="js/config.js?v=1.00.51"></script>
<script src="js/input.js?v=1.00.51"></script>

<script src="js/game.js?v=1.00.51"></script>
<script>window.addEventListener('load', () => Game.init());</script>
</body>
</html>
